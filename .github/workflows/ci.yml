name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '7.0.x'
  LOGIC_PROJECT: './WorkshopLogic/WorkshopLogic.csproj'
  TEST_PROJECT: './WorkshopTests/WorkshopTests.csproj'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: |
        dotnet restore ${{ env.LOGIC_PROJECT }}
        dotnet restore ${{ env.TEST_PROJECT }}
      
    - name: Build project
      run: |
        dotnet build ${{ env.LOGIC_PROJECT }} --no-restore --configuration Release
        dotnet build ${{ env.TEST_PROJECT }} --no-restore --configuration Release
      
    - name: Run Tests with Coverage
      run: |
        dotnet test ${{ env.TEST_PROJECT }} `
          --no-build `
          --configuration Release `
          --collect:"XPlat Code Coverage" `
          --verbosity normal `
          --filter "FullyQualifiedName!~FlaUi"
      
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: '**/coverage.cobertura.xml'
        retention-days: 5
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'