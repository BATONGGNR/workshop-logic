name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '7.0.x'
  LOGIC_PROJECT: './WorkshopLogic/WorkshopLogic.csproj'
  TEST_PROJECT: './WorkshopTests/WorkshopTests.csproj'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: |
        dotnet restore ${{ env.LOGIC_PROJECT }}
        dotnet restore ${{ env.TEST_PROJECT }}
      
    - name: Build project
      run: |
        dotnet build ${{ env.LOGIC_PROJECT }} --no-restore --configuration Release
        dotnet build ${{ env.TEST_PROJECT }} --no-restore --configuration Release
      
    - name: Run unit tests
      run: |
        dotnet test ${{ env.TEST_PROJECT }} \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --filter "FullyQualifiedName!~FlaUi" \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=opencover \
          /p:CoverletOutput=./TestResults/coverage.opencover.xml \
          --logger "trx;LogFileName=test-results.trx"
          
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'
        
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: '**/TestResults/coverage.opencover.xml'